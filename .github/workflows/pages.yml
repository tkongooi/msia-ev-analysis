name: Publish notebook
on:
  push:
    branches: [main]
    paths: [notebooks/01_ev_analysis.ipynb, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install nbconvert
      - run: |
          mkdir site
          jupyter nbconvert --to html notebooks/01_ev_analysis.ipynb --output-dir site --output index
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
